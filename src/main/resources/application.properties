
spring.application.name=InventryProjectMicroservices-1

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://inventryprojectmicroservices-1-60093748731.development.catalystserverless.in}

# Zoho Catalyst AppSail server configuration
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:9000}

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=INFO

# Admin password initialization
app.admin.reset-password=${RESET_ADMIN_PASSWORD:false}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}

logging.level.org.springframework.web.cors=DEBUG
